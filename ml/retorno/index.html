<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-hasZIcqOGq5rEcf0uxDmC/637DsJZutWAgDRmuuPpNk='; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Autorização Mercado Livre · Construart</title>
<style>
  :root {
    --fundo: #0e1014;
    --cartao: #171a21;
    --borda: #262a33;
    --texto: #e9ebef;
    --suave: #9aa1ad;
    --laranja: #f26b1d;
    --verde: #2fb67c;
    --vermelho: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--fundo);
    color: var(--texto);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .cartao {
    width: 100%;
    max-width: 560px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 14px;
    padding: 32px 28px;
  }
  .marca { margin: 0 0 24px; color: var(--texto); font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }
  .marca span { color: var(--laranja); font-weight: 600; font-size: 14px; margin-left: 4px; }
  h1 { margin: 0 0 12px; font-size: 22px; line-height: 1.3; }
  h1.ok { color: var(--verde); }
  h1.erro { color: var(--vermelho); }
  p { margin: 0 0 16px; color: var(--suave); }
  p strong { color: var(--texto); }
  .caixa {
    margin: 20px 0 12px;
    padding: 14px;
    border: 1px solid var(--borda);
    border-radius: 10px;
    background: var(--fundo);
  }
  code {
    display: block;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--texto);
    word-break: break-all;
    user-select: all;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 12px 16px;
    border: 0;
    border-radius: 8px;
    background: var(--laranja);
    color: #fff;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .aviso { font-size: 14px; margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="cartao">
  <p class="marca">construart<span>utilidades</span></p>
  <h1 id="titulo">Autorização do Mercado Livre</h1>
  <p id="texto">Esta página só é usada durante a conexão da conta do Mercado Livre ao painel da Construart. Para conectar, comece pelo painel.</p>
  <div id="caixa" class="caixa" hidden>
    <code id="valor"></code>
    <button id="copiar" type="button">Copiar código</button>
  </div>
  <p id="aviso" class="aviso" hidden></p>
</main>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var state = params.get('state');
  var erro = params.get('error');
  var endereco = window.location.origin + window.location.pathname;

  // Tira o código da barra de endereço e do histórico do navegador.
  if (window.location.search) {
    window.history.replaceState(null, '', window.location.pathname);
  }

  var titulo = document.getElementById('titulo');
  var texto = document.getElementById('texto');
  var caixa = document.getElementById('caixa');
  var valor = document.getElementById('valor');
  var botao = document.getElementById('copiar');
  var aviso = document.getElementById('aviso');

  if (erro) {
    titulo.textContent = 'Autorização não concluída';
    titulo.className = 'erro';
    texto.textContent = 'O Mercado Livre respondeu: ' + (params.get('error_description') || erro) +
      '. Volte ao painel e comece a conexão de novo.';
    return;
  }

  if (!code || !state) {
    return;
  }

  var retorno = endereco + '?code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state);

  titulo.textContent = 'Autorização recebida';
  titulo.className = 'ok';
  texto.textContent = '';
  texto.appendChild(document.createTextNode('Copie o código abaixo e cole no painel, na tela '));
  var tela = document.createElement('strong');
  tela.textContent = 'API Mercado Livre';
  texto.appendChild(tela);
  texto.appendChild(document.createTextNode('. Faça isso logo: o código vale por pouco tempo e só pode ser usado uma vez.'));
  valor.textContent = retorno;
  caixa.hidden = false;
  aviso.textContent = 'Não envie este código para ninguém. Depois de colar no painel, pode fechar esta página.';
  aviso.hidden = false;

  function selecionar() {
    var faixa = document.createRange();
    faixa.selectNodeContents(valor);
    var selecao = window.getSelection();
    selecao.removeAllRanges();
    selecao.addRange(faixa);
  }

  botao.addEventListener('click', function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(retorno).then(function () {
        botao.textContent = 'Copiado ✓';
      }, function () {
        selecionar();
        botao.textContent = 'Selecionado: aperte Cmd+C (ou Ctrl+C)';
      });
    } else {
      selecionar();
      botao.textContent = 'Selecionado: aperte Cmd+C (ou Ctrl+C)';
    }
  });
})();
</script>
</body>
</html>
